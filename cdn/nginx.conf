worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # CDN edge cache for report objects
    proxy_cache_path /var/cache/nginx/reports
                     levels=1:2
                     keys_zone=reports_cache:10m
                     max_size=256m
                     inactive=60m
                     use_temp_path=off;

    log_format cdn '$remote_addr "$request" $status cache=$upstream_cache_status';

    server {
        listen 80;
        server_name _;
        access_log /var/log/nginx/cdn.access.log cdn;

        # Health for compose
        location = /health {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # Public CDN path → MinIO bucket bionicpro-reports
        # Object key example: users/prothetic1/wm=2026-11-23/report.json
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host minio:4566;
            proxy_set_header Connection "";

            # Path-style: /users/... → /bionicpro-reports/users/...
            proxy_pass http://minio:4566/bionicpro-reports/;

            proxy_cache reports_cache;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=600" always;
            add_header Access-Control-Allow-Origin "*" always;
        }
    }
}
