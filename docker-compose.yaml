services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  auth_db:
    image: postgres:14
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5434:5432"
    volumes:
      - ./postgres-auth-data:/var/lib/postgresql/data

  openldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: bionicpro.local
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "389:389"
      - "636:636"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      # Placeholders for Yandex IdP — override via .env / compose override
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-YANDEX_CLIENT_ID_PLACEHOLDER}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-YANDEX_CLIENT_SECRET_PLACEHOLDER}
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      # Яндекс ID: OAuth2 без scope openid (OIDC IdP Яндекс не принимает)
      - ./keycloak/providers:/opt/keycloak/providers
    ports:
      - "8180:8080"
    depends_on:
      - keycloak_db
      - openldap


  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
      network: host
    ports:
      - "8000:8000"
    environment:
      KEYCLOAK_URL: http://localhost:8180
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: reports-frontend
      KEYCLOAK_CLIENT_SECRET: bionicpro-auth-client-secret
      AUTH_PUBLIC_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      REDIRECT_URI: http://localhost:8000/auth/callback
      SESSION_COOKIE_NAME: bionicpro_session
      SESSION_TTL_SECONDS: "1800"
      COOKIE_SECURE: "false"
      TOKEN_ENCRYPTION_KEY: change-me-32-byte-key-for-fernet!!
      DATABASE_URL: postgresql://auth_user:auth_password@auth_db:5432/auth_db
      REPORTS_API_URL: http://reports-api:8001
    depends_on:
      - keycloak
      - auth_db
      - reports-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8000
        REACT_APP_AUTH_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth

  # --- Assignment 2: CRM / telemetry sources, OLAP, Airflow, reports-api ---

  crm_db:
    image: postgres:14
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "5435:5432"
    volumes:
      - ./airflow/crm-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./airflow/data/crm:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      retries: 10

  telemetry_db:
    image: postgres:14
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    ports:
      - "5436:5432"
    volumes:
      - ./airflow/telemetry-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./airflow/data/telemetry:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./airflow/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./airflow/data/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "clickhouse", "--query", "SELECT 1"]
      interval: 5s
      retries: 20
      start_period: 20s

  # S3-compatible store (LocalStack — образ MinIO в среде недоступен).
  # Host 9000 занят ClickHouse → S3 API на 9002→4566
  minio:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "9002:4566"
    volumes:
      - ./airflow/data/minio:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      retries: 20
      start_period: 15s

  minio-init:
    image: amazon/aws-cli:2.17.50
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url=http://minio:4566 s3 mb s3://bionicpro-reports || true;
      aws --endpoint-url=http://minio:4566 s3api put-bucket-acl --bucket bionicpro-reports --acl public-read || true;
      echo minio-init-done
      "

  cdn-nginx:
    build:
      context: ./cdn
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  reports-api:
    build:
      context: ./reports-api
      dockerfile: Dockerfile
      network: host
    ports:
      - "8001:8001"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: bionicpro
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      ETL_PIPELINE: bionicpro_reports_etl
      S3_ENDPOINT: http://minio:4566
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET: bionicpro-reports
      S3_REGION: us-east-1
      CDN_PUBLIC_URL: http://localhost:8082
    depends_on:
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      cdn-nginx:
        condition: service_started

  airflow_db:
    image: postgres:14
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./airflow/data/airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
      network: host
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@bionicpro.local \
          --password admin || true
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__WEBSERVER__SECRET_KEY: bionicpro_airflow_webserver_secret
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    user: "50000:0"
    depends_on:
      airflow_db:
        condition: service_healthy

  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
      network: host
    command: webserver
    ports:
      - "8081:8080"
    environment:
      <<: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    user: "50000:0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      airflow_db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      crm_db:
        condition: service_healthy
      telemetry_db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
      network: host
    command: scheduler
    environment:
      <<: *airflow-common-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    user: "50000:0"
    depends_on:
      airflow_db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
      crm_db:
        condition: service_healthy
      telemetry_db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

